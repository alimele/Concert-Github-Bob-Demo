name: Bob-shell CVE Remediation

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to remediate
        required: true

jobs:
  trigger-remediation:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, '[From: IBM Concert]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm

      - name: Run Bob Shell on the issue
        env:
          BOB_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          PROMPT="Read GitHub issue #${ISSUE_NUMBER} in this repository using the gh CLI. It reports a CVE finding. Research the CVE, identify the affected package and the safe fixed version, update the dependency, verify the project still builds and tests pass, create a branch, and open a pull request with the fix that references issue #${ISSUE_NUMBER}."
          bob run --accept-license --trust --max-turns 40 --log-level info "$PROMPT"
