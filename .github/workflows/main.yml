name: Bob-shell CVE Remediation

on:
  issues:
    types: [opened]

jobs:
  trigger-remediation:
    # Only run for Concert-created tickets, not every issue opened in the repo
    if: contains(github.event.issue.title, '[From: IBM Concert]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash

      - name: Accept license
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: bob --accept-license

      - name: Run Bob Shell on the issue
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bob --version
          PROMPT="Review GitHub issue #${{ github.event.issue.number }} in this repository, titled: ${{ github.event.issue.title }}. This issue reports a CVE finding. Research the CVE, identify the affected package and the safe fixed version, update the dependency, verify the project still builds, and open a pull request with the fix referencing issue #${{ github.event.issue.number }}."
          bob --auth-method api-key -p "$PROMPT" || bob -p "$PROMPT"
